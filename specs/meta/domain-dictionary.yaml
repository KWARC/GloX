# Canonical domain dictionary — GloX (FAUstairs glossary extraction & curation).
# Rules: /specs/engineering/spec-authoring.md §8

schema_version: 1

terms:
  critical_area:
    preferred: Critical area
    definition: >
      Part of the system where errors cause security incidents, data exposure, semantic corruption
      of the domain model, or major regressions in extraction/curation/export flows.
    technical_anchors:
      - AGENTS.md § Critical areas

  glox:
    preferred: GloX
    definition: >
      The FAUstairs Glossary Extractors and Curator — web tool for glossary extraction and domain
      model curation toward MathHub.
    technical_anchors:
      - specs/product/glox.md
    see_also:
      - ../product/glox.md

  faustairs:
    preferred: FAUstairs
    definition: >
      FAU research project on formative assessment; GloX supports its domain model development.
    see_also:
      - ../product/glox.md

  gloxer:
    preferred: GloXer
    definition: >
      Knowledge-representation and domain specialist who performs glossary extraction and curation
      in the FAUstairs workflow.
    see_also:
      - ../product/glox.md

  extractor:
    preferred: Extractor
    definition: >
      User role (EXTRACTOR) that uploads materials, extracts definitions, and works on module
      descriptions. Default role for new signups.
    technical_anchors:
      - prisma/schema.prisma UserRole
    allowed_aliases:
      - label: EXTRACTOR
        context: database enum

  curator:
    preferred: Curator
    definition: >
      User role (CURATOR) with privileges for curation queues, symbol management, and privileged
      file controls beyond Extractor capabilities.
    technical_anchors:
      - prisma/schema.prisma UserRole

  admin:
    preferred: Admin
    definition: >
      User role (ADMIN) with full document visibility and user role management.
    technical_anchors:
      - prisma/schema.prisma UserRole

  email_verification:
    preferred: Email verification
    definition: >
      Gate that marks a user's email as verified; login MUST NOT succeed until verification
      completes after signup.
    technical_anchors:
      - prisma/schema.prisma User.emailVerified
      - src/serverFns/verify.server.ts
      - specs/engineering/features/auth/auth-sessions.md

  authenticated_session:
    preferred: Authenticated session
    definition: >
      Logged-in user session established after verified credentials; lasts up to seven days and is
      invalidated when the user sets a new password.
    technical_anchors:
      - src/server/auth/requireUser.ts
      - specs/engineering/features/auth/auth-sessions.md
      - access_token HttpOnly cookie
      - is_logged_in marker cookie
    allowed_aliases:
      - label: session
        context: shorthand in specs

  password_reset:
    preferred: Password reset
    definition: >
      Flow that emails a time-limited reset link for a registered address and, on success, sets a
      new password and invalidates existing authenticated sessions.
    technical_anchors:
      - src/serverFns/resetPassword.server.ts
      - specs/engineering/features/auth/auth-sessions.md

  password_fingerprint:
    preferred: Password fingerprint
    definition: >
      Value derived from the password hash and embedded in session JWTs so that a password change
      invalidates all existing authenticated sessions.
    technical_anchors:
      - specs/engineering/decisions/jwt-session-fingerprint.md
      - src/server/auth/requireUser.ts

  document:
    preferred: Document
    definition: >
      An uploaded source file (typically PDF) owned by a user, with extracted page text, export
      identity metadata, and associated FloDown blocks.
    technical_anchors:
      - prisma/schema.prisma Document
      - src/server/document/

  document_status:
    preferred: Document status
    definition: >
      Upload/extraction lifecycle for a Document — UPLOADED, TEXT_EXTRACTED, or FAILED.
    technical_anchors:
      - prisma/schema.prisma DocumentStatus
      - prisma/schema.prisma Document.status

  content_hash:
    preferred: Content hash
    definition: >
      Hash of uploaded Document file bytes (`fileHash`) used for per-user upload deduplication.
      Distinct from full-text hash used by the LLM suggestion cache.
    technical_anchors:
      - prisma/schema.prisma Document.fileHash
    allowed_aliases:
      - label: fileHash
        context: database column

  full_text_hash:
    preferred: Full-text hash
    definition: >
      SHA-256 of concatenated Document page text used to decide whether cached LLM suggestions are
      still valid. Distinct from content hash (file bytes).
    technical_anchors:
      - src/server/llm.ts
      - prisma/schema.prisma LlmSuggestion.customPrompt
      - specs/engineering/features/documents-extraction/llm-suggestion-cache.md

  llm_suggestion:
    preferred: LLM suggestion
    definition: >
      Cached LLM-assisted definition discovery result for a Document, reused when the full-text hash
      is unchanged.
    technical_anchors:
      - prisma/schema.prisma LlmSuggestion
      - specs/engineering/features/documents-extraction/llm-suggestion-cache.md
    allowed_aliases:
      - label: LLM definition suggestions
        context: PRD / UI

  flo_down_block:
    preferred: FloDown block
    definition: >
      The unit of curated glossary content — an FTML statement (definition or paragraph) with
      provenance, declared symbols, status, and version history.
    technical_anchors:
      - prisma/schema.prisma FloDownBlock
      - src/types/floDown.types.ts
    allowed_aliases:
      - label: FloDownBlock
        context: database model
      - label: definition
        context: PRD/UI for a definition-type FloDown block
      - label: definition block
        context: UI copy

  statement:
    preferred: Statement
    definition: >
      Authoritative FTML JSON shape stored on a FloDown block; type is definition or paragraph.
    technical_anchors:
      - prisma/schema.prisma FloDownBlock.statement
      - src/types/floDown.types.ts

  definiendum:
    preferred: Definiendum
    definition: >
      The term being defined in a definition statement (inline FTML node). It names or verbalizes a
      symbol in that definition (e.g. "triangle" in English, "Dreieck" in German). A definiendum
      references a symbol URI; it does not by itself declare the symbol. The same symbol MAY appear
      as a definiendum in many definitions (including other languages). Distinct from symbol
      declaration and from declared symbols on a FloDown block.
    technical_anchors:
      - src/types/floDown.types.ts
      - specs/engineering/external-deps/libraries/ftml.md
    see_also:
      - declared_symbols
      - symbol

  declared_symbols:
    preferred: Declared symbols
    definition: >
      Local symbol names and URIs a FloDown block introduces (declares) once; the declaration
      establishes the opaque FloDown symbol URI. Deleting such a block removes matching symrefs from
      other blocks. Not the same as definienda: a later definition MAY use a definiendum for an
      already-declared symbol without declaring it again.
    technical_anchors:
      - prisma/schema.prisma FloDownBlock.declaredSymbolsInfo
      - prisma/schema.prisma FloDownBlock.declaredSymbols
      - src/server/floDownBlockDeclaredSymbols.ts
      - specs/engineering/external-deps/libraries/ftml.md

  symref:
    preferred: Symref
    definition: >
      An inline term reference in FTML content pointing to a local Symbol or external MathHub URI.
    technical_anchors:
      - src/serverFns/symbolicRef.server.ts

  symbol:
    preferred: Symbol
    definition: >
      A named concept in the local symbolic catalog. Identity is the opaque URI FloDown returned
      (E-FTML-06). GloX allows at most one live declaration of a given URI (R-SYM-02). Display name
      is search-only. A Symbol is associated when a non-discarded FloDown block lists that URI in
      `declaredSymbolsInfo`.
    technical_anchors:
      - prisma/schema.prisma Symbol
      - src/serverFns/symbol.server.ts

  symbolic_catalog:
    preferred: Symbolic catalog
    definition: >
      Searchable sources for Symbols and suggestions when authoring definienda and symrefs: the local
      DB Symbol table, the static client catalog served for suggestions, and MathHub FTML search.
      Automatic suggestion matching stems English, German, and French; manual picker search is
      language-agnostic substring match on symbol name.
    technical_anchors:
      - prisma/schema.prisma Symbol
      - src/serverFns/symbolicCatalog.server.ts
      - src/server/symbolic-suggestions/
      - specs/engineering/features/symbols-semantics/search.md
      - specs/engineering/features/symbols-semantics/registry.md
    allowed_aliases:
      - label: Symbol registry
        context: PRD OOS / informal wording
      - label: local catalog
        context: PRD intro shorthand
      - label: static symbolic catalog
        context: client catalog.json / symbolicCatalog.server.ts

  symbol_propagation:
    preferred: Symbol propagation
    definition: >
      Curator/Admin operation that replaces matching local symbol references (or MathHub URIs) across
      FloDown block statements and records version history for each changed block.
    technical_anchors:
      - specs/engineering/features/symbols-semantics/propagation.md
      - src/serverFns/SymbolPropagation.server.ts
      - src/server/ftml/convertLocalSymbolToMathHub.ts
    allowed_aliases:
      - label: MathHub replacement
        context: applyMathHubReplacement path

  symbol_confirmation:
    preferred: Symbol confirmation
    definition: >
      Curator/Admin mark that a Symbol is not a duplicate (`hasConfirmed`), recording the confirming
      user; Extractors MUST NOT confirm deduplication.
    technical_anchors:
      - prisma/schema.prisma Symbol.hasConfirmed
      - prisma/schema.prisma Symbol.confirmedById
    allowed_aliases:
      - label: deduplication
        context: PRD wording for confirm-not-duplicate workflow
      - label: confirmed flag
        context: database / SDD

  original_text:
    preferred: Original text
    definition: >
      Source text captured when a FloDown block is created from a selection; preserved alongside the
      FTML statement and version history.
    technical_anchors:
      - prisma/schema.prisma FloDownBlock.originalText
    allowed_aliases:
      - label: selected source text
        context: PRD creation wording

  provenance:
    preferred: Provenance
    definition: >
      Origin metadata for curated content (document, page, timestamps, and related context) stored
      with FloDown blocks and injected into exported sTeX.
    technical_anchors:
      - src/serverFns/floDownBlockProvenance.server.ts
      - src/server/ftml/addProvenanceData.ts
      - specs/engineering/features/curation-export/stex-export.md

  future_repo:
    preferred: Future repository
    definition: >
      MathHub archive path prefix where exported content will live (e.g. smglom/softeng,
      courses/FAU/module-descriptions).
    technical_anchors:
      - prisma/schema.prisma Document.futureRepo
      - prisma/schema.prisma FloDownBlock.futureRepo

  export_identity:
    preferred: Export identity
    definition: >
      The tuple that locates content in the MathHub archive namespace. For Documents: (future
      repository, file path, language). For FloDown blocks and Symbols: (future repository, file
      path, file name, language). For Module descriptions: (future repository, modules path,
      definitions path, language). The four-field FloDown tuple is also the file identity used to
      group blocks in the curation queue.
    technical_anchors:
      - prisma/schema.prisma FloDownBlock
      - prisma/schema.prisma Document
      - prisma/schema.prisma ModuleDescription
      - prisma/schema.prisma ModuleDescription.modulesFilePath
      - prisma/schema.prisma ModuleDescription.defsFilePath
    allowed_aliases:
      - label: File identity
        context: curation queue grouping of FloDown blocks by four-field export identity

  modules_catalog:
    preferred: FAU modules catalog
    definition: >
      Configured, file-based catalog of FAU course modules used to search modules and seed
      Module description title, Inhalt, and Lernziele statements. Not a live Campo/StudOn API.
    technical_anchors:
      - src/server/modules/moduleCatalog.ts
    allowed_aliases:
      - label: module catalog
        context: shorthand in specs and UI

  module_title:
    preferred: Title
    definition: >
      The module-description title statement seeded from the FAU modules catalog
      (ModuleDescription.titleStatement). Distinct from Document display names.
    technical_anchors:
      - prisma/schema.prisma ModuleDescription.titleStatement

  inhalt:
    preferred: Inhalt
    definition: >
      FAU module-description section for course content; seeded as a statement on Module description
      (ModuleDescription.inhaltStatement) and exported under an Inhalt section.
    technical_anchors:
      - prisma/schema.prisma ModuleDescription.inhaltStatement

  lernziele:
    preferred: Lernziele
    definition: >
      FAU module-description section for learning objectives; seeded as a statement on Module
      description (ModuleDescription.lernzieleStatement) and exported as Lernziele und Kompetenzen.
    technical_anchors:
      - prisma/schema.prisma ModuleDescription.lernzieleStatement
    allowed_aliases:
      - label: Lernziele und Kompetenzen
        context: module TeX export section heading

  stex:
    preferred: sTeX
    definition: >
      Semantic TeX markup used for MathHub archive exports (module TeX, definition TeX, and sTeX
      generated from finalized FloDown blocks).
    technical_anchors:
      - public/flodown/
      - specs/engineering/features/module-descriptions/export.md
      - specs/engineering/features/curation-export/stex-export.md
    see_also:
      - ../engineering/external-deps/vendors/flodown.md

  curation_queue:
    preferred: Curation queue
    definition: >
      Curator/Admin review list of FloDown blocks filtered by FloDown block status; Extractors MUST
      NOT access it or change status via the curation workflow.
    technical_anchors:
      - specs/engineering/features/curation-export/queue.md
      - src/routes/curation.tsx
    allowed_aliases:
      - label: curation review queue
        context: PRD wording

  module_description:
    preferred: Module description
    definition: >
      A FAU course module record created from the FAU modules catalog, with seeded Title, Inhalt,
      and Lernziele statements and associated definition FloDown blocks.
    technical_anchors:
      - prisma/schema.prisma ModuleDescription
      - src/server/modules/moduleCatalog.ts
    allowed_aliases:
      - label: ModuleDescription
        context: database model

  flo_down_block_status:
    preferred: FloDown block status
    definition: >
      Curation lifecycle state — DISCARDED, EXTRACTED, FINALIZED_IN_FILE, or SUBMITTED_TO_MATHHUB.
    technical_anchors:
      - prisma/schema.prisma FloDownBlockStatus

  index_status:
    preferred: Index status
    definition: >
      Export workflow state — EXTRACTED, FINALIZED, or SUBMITTED_TO_MATHHUB. On Documents, set when
      the first mark reference is created (null until then). On ModuleDescription rows, tracks module
      export progress (defaults to EXTRACTED).
    technical_anchors:
      - prisma/schema.prisma IndexStatus
      - src/serverFns/markReference.server.ts

  mark_reference:
    preferred: Mark reference
    definition: >
      A lightweight symbol mention on a document page (verbalization) used for LaTeX index export.
    technical_anchors:
      - prisma/schema.prisma MarkReference

  mathhub:
    preferred: MathHub
    definition: >
      External semantic content server (mathhub.info) providing FTML backend, symbol resolution,
      and archive hosting for exported glossaries.
    technical_anchors:
      - src/lib/ftmlClient.ts
      - specs/engineering/external-deps/vendors/mathhub.md

  flodown:
    preferred: FloDown
    definition: >
      Browser-side WASM library for authoring, rendering, and serializing FTML/sTeX; used for
      preview and export in GloX.
    technical_anchors:
      - public/flodown/
      - src/lib/flodownClient.ts
      - specs/engineering/external-deps/vendors/flodown.md

  ftml:
    preferred: FTML
    definition: >
      Flexible TeX/Math Language — JSON-based semantic markup for definitions, symbols, and math.
    technical_anchors:
      - "@flexiformal/ftml"
      - specs/engineering/external-deps/libraries/ftml.md

  extract_block_type:
    preferred: Extract block type
    definition: >
      UI-only choice when creating a FloDown block — definition (definiendum editing) or paragraph
      (symref only). Maps to statement.type in FTML.
    technical_anchors:
      - src/types/blockType.ts

  ftml_block:
    preferred: FTML block
    definition: >
      TypeScript shape for one top-level block in a FloDown block statement — definition or paragraph.
    technical_anchors:
      - src/types/floDown.types.ts

  symdecl:
    preferred: symdecl
    definition: >
      GloX-only flag on a definiendum inline node — true declares a local Symbol; false references only.
    technical_anchors:
      - src/types/floDown.types.ts

  for_symbols:
    preferred: for_symbols
    definition: >
      FTML field on a definition block listing declared symbol URIs introduced by that definition.
    technical_anchors:
      - src/types/floDown.types.ts

  extract:
    preferred: Extract
    definition: >
      Page-text highlight for curated FloDown block content (contrasts with mark reference for index
      mentions).
    technical_anchors:
      - src/server/text-selection.ts

  sniffy:
    preferred: Sniffy
    definition: >
      Automatic symref suggestion tool in the extraction and curation UI.
    technical_anchors:
      - src/hooks/files/useSniffyFlow.ts

  unified_symbolic_reference:
    preferred: Unified symbolic reference
    definition: >
      In-memory symref picker value — either a MathHub URI or a local Symbol keyed by export identity.
      Only the resolved URI is written into FTML.
    technical_anchors:
      - src/server/document/SymbolicRef.types.ts

  document_page:
    preferred: Document page
    definition: >
      One page of extracted text from an uploaded Document; anchors FloDown blocks and mark references.
    technical_anchors:
      - prisma/schema.prisma DocumentPage

  latex_table:
    preferred: LaTeX table
    definition: >
      Generated LaTeX/sTeX and version history for a Document, keyed by export identity (draft or
      final).
    technical_anchors:
      - prisma/schema.prisma LatexTable
      - specs/engineering/features/curation-export/latex-versioning.md
    allowed_aliases:
      - label: LaTeX versioning
        context: PRD / feature name


  flo_down_block_version:
    preferred: FloDown block version
    definition: >
      Snapshot of statement and originalText after each FloDown block edit.
    technical_anchors:
      - prisma/schema.prisma FloDownBlockVersion
